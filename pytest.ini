[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    private_data: Tests requiring private market datasets (data/raw or data/processed).
    generated_results: Tests requiring generated research artifacts in results/.
    local_account_state: Tests requiring local account-state files.
    macos_env: Tests requiring macOS, MotiveWave, or installed LaunchAgents.
