name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Note on MotiveWave Java SDK vs Headless CI Boundaries:
# MotiveWave desktop libraries (/Applications/MotiveWave.app/Contents/Java/*)
# and local JDK 25 (tools/jdk25) are local macOS desktop dependencies used for
# compiling custom studies into build/LucidPropEnsemble.jar.
# In headless Ubuntu CI, the automated pytest suite runs comprehensive AST, schema,
# Python parity models, and risk invariant checks without requiring local GUI jars.

jobs:
  wiki-integrity:
    name: Wiki Integrity & Governance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Wiki Integrity Check
        run: python scripts/verify_wiki_integrity.py

  pytest-suite:
    name: Pytest Automated Test Suite
    runs-on: ubuntu-latest
    needs: wiki-integrity
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: pytest -v
